<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindMend · a quiet place to talk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;1,400;1,500&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14121F;
    --panel:#1E1A2E;
    --panel-raised:#241F38;
    --mist:#9C93B8;
    --paper:#F2EFF9;
    --bloom:#C9A6E8;
    --bloom-dim:#8B7AAE;
    --line:rgba(242,239,249,0.08);

    --e-warm:#F0B786;
    --e-gentle:#B7A8D9;
    --e-concerned:#7FB3C9;
    --e-soothing:#6FB8A8;
    --e-encouraging:#E8C468;
    --e-celebratory:#E8A0B0;
    --e-somber:#8E82AE;
    --e-crisis:#6FB8A8;

    --orb-color: var(--e-gentle);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:radial-gradient(ellipse at top, #1B1830 0%, var(--ink) 55%);
    color:var(--paper);
    font-family:'Sora', sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 24px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .brand{
    display:flex;
    flex-direction:column;
    line-height:1.2;
  }
  .brand .name{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:20px;
    color:var(--paper);
  }
  .brand .tagline{
    font-size:12px;
    color:var(--mist);
    letter-spacing:0.02em;
  }
  .controls{
    display:flex;
    align-items:center;
    gap:10px;
  }
  select#lang{
    background:var(--panel-raised);
    color:var(--paper);
    border:1px solid var(--line);
    border-radius:20px;
    padding:7px 14px;
    font-family:'Sora', sans-serif;
    font-size:13px;
    cursor:pointer;
    appearance:none;
  }
  button.icon-btn{
    width:38px;
    height:38px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--panel-raised);
    color:var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:16px;
    transition:background 0.2s ease, transform 0.15s ease;
  }
  button.icon-btn:hover{ background:#2C2645; }
  button.icon-btn:active{ transform:scale(0.94); }
  button.icon-btn.muted{ opacity:0.45; }

  .orb-zone{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:22px 0 8px;
    flex-shrink:0;
  }
  .orb{
    width:64px;
    height:64px;
    border-radius:50%;
    background:radial-gradient(circle at 32% 28%, color-mix(in srgb, var(--orb-color) 85%, white 15%), var(--orb-color) 60%, color-mix(in srgb, var(--orb-color) 60%, black 25%) 100%);
    box-shadow:0 0 28px 4px color-mix(in srgb, var(--orb-color) 45%, transparent);
    animation:breathe 16s ease-in-out infinite;
    transition:background 1.4s ease, box-shadow 1.4s ease;
  }
  .orb.speaking{ animation-duration:2.4s; }
  @keyframes breathe{
    0%{ transform:scale(1); }
    25%{ transform:scale(1.09); }
    50%{ transform:scale(1.09); }
    75%{ transform:scale(1); }
    100%{ transform:scale(1); }
  }
  .orb-label{
    margin-top:10px;
    font-size:12px;
    color:var(--mist);
    letter-spacing:0.02em;
  }

  .chat-wrap{
    flex:1;
    overflow-y:auto;
    display:flex;
    justify-content:center;
  }
  .chat-log{
    width:100%;
    max-width:640px;
    padding:8px 20px 24px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .row{ display:flex; gap:10px; align-items:flex-end; }
  .row.user{ justify-content:flex-end; }
  .row.bot{ justify-content:flex-start; }

  .mini-orb{
    width:26px;
    height:26px;
    border-radius:50%;
    flex-shrink:0;
    background:radial-gradient(circle at 32% 28%, color-mix(in srgb, var(--bubble-color, var(--e-gentle)) 85%, white 15%), var(--bubble-color, var(--e-gentle)));
    margin-bottom:2px;
  }

  .bubble{
    max-width:78%;
    padding:13px 16px;
    border-radius:16px;
    font-size:14.5px;
    line-height:1.6;
    white-space:pre-wrap;
  }
  .row.bot .bubble{
    background:var(--panel);
    border:1px solid var(--line);
    border-bottom-left-radius:4px;
    color:var(--paper);
  }
  .row.user .bubble{
    background:linear-gradient(135deg, var(--bloom) 0%, var(--bloom-dim) 100%);
    color:#1C1730;
    border-bottom-right-radius:4px;
  }

  .typing{
    display:flex;
    gap:4px;
    padding:6px 2px;
  }
  .typing span{
    width:6px; height:6px; border-radius:50%;
    background:var(--mist);
    animation:blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay:0.2s; }
  .typing span:nth-child(3){ animation-delay:0.4s; }
  @keyframes blink{ 0%,80%,100%{opacity:0.25;} 40%{opacity:1;} }

  .input-bar{
    flex-shrink:0;
    display:flex;
    justify-content:center;
    padding:16px 20px 22px;
    border-top:1px solid var(--line);
    background:linear-gradient(180deg, transparent 0%, var(--ink) 40%);
  }
  .input-pill{
    width:100%;
    max-width:640px;
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--panel-raised);
    border:1px solid var(--line);
    border-radius:26px;
    padding:6px 8px 6px 18px;
  }
  .input-pill input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--paper);
    font-family:'Sora', sans-serif;
    font-size:14.5px;
    padding:8px 0;
  }
  .input-pill input::placeholder{ color:var(--mist); }

  button.round{
    width:40px; height:40px;
    border-radius:50%;
    border:none;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:transform 0.15s ease, background 0.2s ease;
  }
  button.round:active{ transform:scale(0.92); }
  #mic-btn{ background:transparent; color:var(--mist); border:1px solid var(--line); }
  #mic-btn.recording{ background:var(--e-concerned); color:#0E2027; border-color:var(--e-concerned); animation:pulse-mic 1.4s infinite; }
  @keyframes pulse-mic{
    0%{ box-shadow:0 0 0 0 color-mix(in srgb, var(--e-concerned) 55%, transparent); }
    70%{ box-shadow:0 0 0 10px transparent; }
    100%{ box-shadow:0 0 0 0 transparent; }
  }
  #send-btn{ background:var(--bloom); color:#1C1730; }
  #send-btn:hover{ background:#D6B8F2; }

  .hint{
    text-align:center;
    font-size:11px;
    color:var(--mist);
    margin-top:8px;
    max-width:640px;
  }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--panel-raised); border-radius:4px; }

  @media (max-width:480px){
    .topbar{ padding:12px 16px; }
    .brand .name{ font-size:17px; }
    .chat-log{ padding:8px 12px 16px; }
    .bubble{ max-width:86%; font-size:14px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="name">MindMend</span>
    <span class="tagline" id="tagline">a quiet place to talk</span>
  </div>
  <div class="controls">
    <select id="lang" aria-label="Language">
      <option value="en">English</option>
      <option value="hi">हिंदी</option>
      <option value="te">తెలుగు</option>
    </select>
    <button class="icon-btn" id="voice-toggle" title="Toggle Scyla's voice" aria-label="Toggle voice replies">🔊</button>
  </div>
</div>

<div class="orb-zone">
  <div class="orb" id="orb"></div>
  <div class="orb-label" id="orb-label">Scyla is here</div>
</div>

<div class="chat-wrap">
  <div class="chat-log" id="chat-log"></div>
</div>

<div class="input-bar">
  <div style="width:100%; max-width:640px; display:flex; flex-direction:column; align-items:center;">
    <div class="input-pill">
      <input type="text" id="msg-input" placeholder="Type how you're feeling..." autocomplete="off">
      <button class="round" id="mic-btn" title="Speak instead" aria-label="Voice input">🎙</button>
      <button class="round" id="send-btn" title="Send" aria-label="Send message">➤</button>
    </div>
    <div class="hint" id="mic-hint"></div>
  </div>
</div>

<script>
const API_BASE = window.location.origin;

const EMOTION_COLOR = {
  warm: 'var(--e-warm)',
  gentle: 'var(--e-gentle)',
  concerned: 'var(--e-concerned)',
  soothing: 'var(--e-soothing)',
  encouraging: 'var(--e-encouraging)',
  celebratory: 'var(--e-celebratory)',
  somber: 'var(--e-somber)',
  crisis: 'var(--e-crisis)',
};

const EMOTION_LABEL = {
  en: { warm:"Scyla feels warm", gentle:"Scyla is listening gently", concerned:"Scyla is concerned for you",
        soothing:"Scyla is here to steady you", encouraging:"Scyla is cheering you on",
        celebratory:"Scyla is happy with you", somber:"Scyla is sitting with you", crisis:"Scyla is right here with you" },
  hi: { warm:"मीरा को अच्छा लग रहा है", gentle:"मीरा ध्यान से सुन रही है", concerned:"मीरा को आपकी चिंता है",
        soothing:"मीरा आपको संभालने के लिए यहाँ है", encouraging:"मीरा आपका हौसला बढ़ा रही है",
        celebratory:"मीरा आपके साथ खुश है", somber:"मीरा आपके साथ बैठी है", crisis:"मीरा अभी आपके साथ है" },
  te: { warm:"మీరాకి హాయిగా అనిపిస్తోంది", gentle:"మీరా శ్రద్ధగా వింటోంది", concerned:"మీరాకి మీ గురించి ఆందోళనగా ఉంది",
        soothing:"మీరా మిమ్మల్ని స్థిరపరచడానికి ఇక్కడ ఉంది", encouraging:"మీరా మిమ్మల్ని ప్రోత్సహిస్తోంది",
        celebratory:"మీరా మీతో సంతోషంగా ఉంది", somber:"మీరా మీతో కూర్చుంది", crisis:"మీరా ఇప్పుడు మీతోనే ఉంది" },
};

const PLACEHOLDER = {
  en: "Type how you're feeling...",
  hi: "आप कैसा महसूस कर रहे हैं, लिखिए...",
  te: "మీరు ఎలా భావిస్తున్నారో టైప్ చేయండి...",
};

const TAGLINE = {
  en: "a quiet place to talk",
  hi: "बात करने के लिए एक शांत जगह",
  te: "మాట్లాడటానికి ఒక ప్రశాంతమైన స్థలం",
};

const MIC_LANG = { en: 'en-IN', hi: 'hi-IN', te: 'te-IN' };
const SPEECH_LANG = { en: 'en-IN', hi: 'hi-IN', te: 'te-IN' };

const orb = document.getElementById('orb');
const orbLabel = document.getElementById('orb-label');
const chatLog = document.getElementById('chat-log');
const input = document.getElementById('msg-input');
const sendBtn = document.getElementById('send-btn');
const micBtn = document.getElementById('mic-btn');
const micHint = document.getElementById('mic-hint');
const langSelect = document.getElementById('lang');
const voiceToggle = document.getElementById('voice-toggle');
const tagline = document.getElementById('tagline');

let history = [];
let voiceEnabled = true;
let currentLang = 'en';

function setEmotion(emotion){
  const color = EMOTION_COLOR[emotion] || EMOTION_COLOR.gentle;
  document.documentElement.style.setProperty('--orb-color', color);
  orbLabel.textContent = (EMOTION_LABEL[currentLang] || EMOTION_LABEL.en)[emotion] || (EMOTION_LABEL.en.gentle);
}

function addBubble(role, text, emotion){
  const row = document.createElement('div');
  row.className = 'row ' + (role === 'user' ? 'user' : 'bot');

  if(role !== 'user'){
    const mini = document.createElement('div');
    mini.className = 'mini-orb';
    mini.style.setProperty('--bubble-color', EMOTION_COLOR[emotion] || EMOTION_COLOR.gentle);
    row.appendChild(mini);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  row.appendChild(bubble);

  chatLog.appendChild(row);
  chatLog.parentElement.scrollTop = chatLog.parentElement.scrollHeight + 200;
  return row;
}

function addTyping(){
  const row = document.createElement('div');
  row.className = 'row bot';
  row.id = 'typing-row';
  const mini = document.createElement('div');
  mini.className = 'mini-orb';
  row.appendChild(mini);
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  row.appendChild(bubble);
  chatLog.appendChild(row);
  chatLog.parentElement.scrollTop = chatLog.parentElement.scrollHeight + 200;
}

function removeTyping(){
  const row = document.getElementById('typing-row');
  if(row) row.remove();
}

function speak(text, lang){
  if(!voiceEnabled || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = SPEECH_LANG[lang] || 'en-IN';
  utter.rate = 0.98;
  utter.pitch = 1.03;
  utter.onstart = () => orb.classList.add('speaking');
  utter.onend = () => orb.classList.remove('speaking');
  window.speechSynthesis.speak(utter);
}

async function sendMessage(text){
  if(!text.trim()) return;
  addBubble('user', text);
  history.push({ role: 'user', content: text });
  input.value = '';
  addTyping();

  try{
    const res = await fetch(API_BASE + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: history.slice(0, -1), language: currentLang })
    });
    const data = await res.json();
    removeTyping();
    addBubble('bot', data.reply, data.emotion);
    setEmotion(data.emotion);
    history.push({ role: 'assistant', content: data.reply });
    speak(data.reply, currentLang);
  }catch(err){
    removeTyping();
    addBubble('bot', "I'm having trouble reaching the server right now — is it still running?", 'concerned');
  }
}

sendBtn.addEventListener('click', () => sendMessage(input.value));
input.addEventListener('keydown', (e) => { if(e.key === 'Enter') sendMessage(input.value); });

langSelect.addEventListener('change', (e) => {
  currentLang = e.target.value;
  input.placeholder = PLACEHOLDER[currentLang];
  tagline.textContent = TAGLINE[currentLang];
});

voiceToggle.addEventListener('click', () => {
  voiceEnabled = !voiceEnabled;
  voiceToggle.textContent = voiceEnabled ? '🔊' : '🔇';
  voiceToggle.classList.toggle('muted', !voiceEnabled);
  if(!voiceEnabled) window.speechSynthesis.cancel();
});

// --- Voice input (Web Speech API) ---
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let recording = false;

if(SpeechRecognition){
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => {
    recording = true;
    micBtn.classList.add('recording');
  };
  recognition.onend = () => {
    recording = false;
    micBtn.classList.remove('recording');
  };
  recognition.onerror = () => {
    recording = false;
    micBtn.classList.remove('recording');
  };
  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    input.value = transcript;
    sendMessage(transcript);
  };

  micBtn.addEventListener('click', () => {
    if(recording){ recognition.stop(); return; }
    recognition.lang = MIC_LANG[currentLang] || 'en-IN';
    recognition.start();
  });
}else{
  micBtn.disabled = true;
  micBtn.style.opacity = '0.35';
  micHint.textContent = 'Voice input needs a Chromium-based browser (Chrome/Edge).';
}

// Initial greeting
setEmotion('gentle');
addBubble('bot', "Hey, I'm Scyla. This is a quiet space to just talk — no judgment, no pressure. What's actually going on with you today?", 'warm');
setEmotion('warm');
history.push({ role: 'assistant', content: "Hey, I'm Scyla. This is a quiet space to just talk — no judgment, no pressure. What's actually going on with you today?" });
</script>

</body>
</html>
